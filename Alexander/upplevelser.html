<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title> Upplevelser och aktiviteter </title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm">
            <div class="container-xl">
                <a class="navbar-brand fs-3 fw-semibold text-primary" href="#">Aten</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="#">Historia</a>
                        <a class="nav-link" href="#">Aktiviteter</a>
                        <a class="nav-link" href="#">Mat & dryck</a>
                        <a class="nav-link text-primary" href="#">Ta dig runt</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="Slide 4"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="images/beach.jpg" style="min-height: 500px; max-height: 900px;" class="d-block w-100 object-fit-cover" alt="...1">
                        <div class="carousel-caption d-block" style="bottom: 65%">     
                            <h1 class="display-3 fw-bold">Beaches & Riviera</h1>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="images/tours.jpg" style="min-height: 500px; max-height: 900px;" class="d-block w-100 object-fit-cover" alt="...2">
                        <div class="carousel-caption d-block" style="bottom: 65%">     
                            <h1 class="display-3 fw-bold">Tours</h1>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="images/sports.jpg" style="min-height: 500px; max-height: 900px;" class="d-block w-100 object-fit-cover" alt="...3">
                        <div class="carousel-caption d-block" style="bottom: 65%">     
                            <h1 class="display-3 fw-bold">Sports & Outdoors</h1>
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="10000">
                        <img src="images/family.jpg" style="min-height: 500px; max-height: 900px;" class="d-block w-100 object-fit-cover" alt="...4">
                        <div class="carousel-caption d-block" style="bottom: 65%">     
                            <h1 class="display-3 fw-bold">Family</h1>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Bootstrap bundle behövs för den kollapsande mobilmenyn. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
